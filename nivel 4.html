<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Critical Mass - Nivel 4 CORREGIDO</title>
    <style>
        :root { --danger: #ff4444; --success: #00C851; --neutral: #ccff00; --bg: #0f1414; }
        body { background: var(--bg); color: white; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        
        #game-container { background: #1a1e1e; padding: 25px; border: 2px solid #34495e; border-radius: 10px; width: 450px; text-align: center; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        
        .stats-row { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .stat-card { background: #000; padding: 10px; border: 1px solid #333; width: 45%; }
        .label { font-size: 0.7rem; color: #888; display: block; margin-bottom: 5px; }
        .value { font-size: 1.8rem; font-weight: bold; transition: color 0.3s; }

        #temp-monitor { width: 100%; height: 25px; background: #222; border-radius: 5px; margin: 15px 0; position: relative; overflow: hidden; border: 1px solid #444; }
        #temp-bar { width: 25%; height: 100%; background: var(--success); transition: width 0.2s; }
        #limit-line { position: absolute; right: 0; top: 0; height: 100%; width: 4px; background: var(--danger); box-shadow: 0 0 10px red; }

        #vial { width: 120px; height: 160px; border: 4px solid #bdc3c7; margin: 20px auto; position: relative; border-radius: 0 0 30px 30px; background: rgba(255,255,255,0.05); overflow: hidden; }
        #liquid { width: 100%; height: 70%; position: absolute; bottom: 0; transition: background 0.4s, height 0.4s; background: #ff0044; }
        
        #screen { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; border-radius: 8px; }
        .advice { font-size: 0.8rem; color: #aaa; margin: 15px 0; line-height: 1.4; }
        
        .btn-retry { background: var(--success); color: white; border: none; padding: 12px 25px; cursor: pointer; font-family: inherit; font-weight: bold; border-radius: 4px; }
        .btn-retry:hover { background: #00e676; }
    </style>
</head>
<body>
<a href="index.html" style="
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 15px;
    background: rgba(0, 255, 65, 0.1);
    border: 1px solid #00ff41;
    color: #00ff41;
    text-decoration: none;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    font-weight: bold;
    border-radius: 4px;
    z-index: 2000;
    transition: all 0.3s;
">
    &lt; VOLVER AL MENU
</a>
<div id="game-container">
    <div class="stats-row">
        <div class="stat-card">
            <span class="label">NIVEL DE pH</span>
            <div id="ph-val" class="value">1.2</div>
        </div>
        <div class="stat-card">
            <span class="label">ESTABILIZACIÓN</span>
            <div id="progress-val" class="value">0%</div>
        </div>
    </div>

    <div id="temp-monitor">
        <div id="temp-bar"></div>
        <div id="limit-line"></div>
    </div>
    <div id="temp-num" style="font-weight: bold; color: var(--neutral); margin-bottom: 10px;">25°C</div>

    <div id="vial">
        <div id="liquid"></div>
    </div>

    <div style="font-size: 0.8rem; color: #666;">
        [↑] INYECTAR BASE | [↓] REFRIGERAR
    </div>

    <div id="screen">
        <h1 id="screen-title"></h1>
        <p id="screen-reason"></p>
        <p class="advice" id="screen-advice"></p>
        <button class="btn-retry" onclick="location.reload()">REINTENTAR</button>
    </div>
</div>



<script>
    // Variables de estado
    let ph = 1.2;
    let temp = 25;
    let stability = 0;
    let gameActive = true;

    // Referencias al DOM
    const phDisplay = document.getElementById('ph-val');
    const tempDisplay = document.getElementById('temp-num');
    const tempBar = document.getElementById('temp-bar');
    const progressDisplay = document.getElementById('progress-val');
    const liquid = document.getElementById('liquid');
    const screen = document.getElementById('screen');

    const gameLoop = setInterval(() => {
        if (!gameActive) return;

        // 1. Lógica Física Sutil
        ph -= 0.008; // El ácido corroe constantemente
        if (temp > 25) temp -= 0.2; // Enfriamiento pasivo
        
        // 2. Actualizar Interfaz
        phDisplay.textContent = ph.toFixed(1);
        tempDisplay.textContent = Math.floor(temp) + "°C";
        tempBar.style.width = Math.min(temp, 100) + "%";

        // 3. Color del Líquido según pH
        // 0 = Rojo, 7 = Verde, 14 = Azul
        let hue = ph * 15; 
        if(hue > 250) hue = 250;
        liquid.style.background = `hsla(${hue}, 80%, 40%, 0.8)`;
        liquid.style.height = (50 + ph * 2) + "%"; // El volumen sube al añadir base

        // 4. Lógica de Estabilización (Zona de éxito pH 6-8)
        if (ph >= 6.0 && ph <= 8.0) {
            stability += 0.4;
            phDisplay.style.color = "var(--success)";
        } else {
            stability = Math.max(0, stability - 0.2);
            phDisplay.style.color = ph < 6.0 ? "var(--danger)" : "#3498db";
        }
        progressDisplay.textContent = Math.floor(stability) + "%";

        // 5. Condiciones de Derrota/Victoria
        if (temp >= 100) {
            finish(false, "EXPLOSIÓN TÉRMICA", "Superaste los 100°C.", "La neutralización libera energía. Sin refrigerante, el calor activó el explosivo.");
        }
        else if (ph <= 0) {
            finish(false, "CORROSIÓN TOTAL", "El pH llegó a 0.", "El ácido disolvió el mecanismo de seguridad. Debiste neutralizarlo antes.");
        }
        else if (stability >= 100) {
            finish(true, "¡ESTABILIZADO!", "pH Neutro alcanzado.", "Excelente gestión de la temperatura y el equilibrio químico.");
        }

    }, 50);

    // Controles
    document.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        if (e.key === "ArrowUp") {
            ph += 0.6;
            temp += 8;
        }
        if (e.key === "ArrowDown") {
            temp -= 12;
            ph -= 0.1;
        }
    });

    function finish(win, title, reason, advice) {
        gameActive = false;
        clearInterval(gameLoop);
        screen.style.display = "flex";
        document.getElementById('screen-title').textContent = title;
        document.getElementById('screen-title').style.color = win ? "var(--success)" : "var(--danger)";
        document.getElementById('screen-reason').textContent = reason;
        document.getElementById('screen-advice').textContent = advice;
    }
</script>
</body>

</html>
