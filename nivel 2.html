<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Critical Mass - Nivel 2</title>
    <style>
        :root { --danger: #ff4444; --success: #00C851; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
        
        #game-container { background: #1a1a1a; padding: 25px; border: 3px solid #333; border-radius: 10px; width: 450px; text-align: center; position: relative; }
        
        #main-timer { font-size: 3.5rem; color: var(--danger); font-weight: bold; margin-bottom: 10px; text-shadow: 0 0 10px rgba(255,0,0,0.5); }
        
        #sensor-container { width: 350px; height: 70px; background: #222; border: 3px solid #555; border-radius: 35px; margin: 20px auto; position: relative; transition: transform 0.1s linear; }
        #mercury-drop { width: 30px; height: 30px; background: radial-gradient(circle at 30% 30%, #fff, #666); border-radius: 50%; position: absolute; top: 17px; left: 160px; box-shadow: 0 0 15px #aaa; }
        .contact { width: 12px; height: 40px; background: #ffd700; position: absolute; top: 15px; box-shadow: 0 0 10px #ffd700; }
        .left { left: 8px; } .right { right: 8px; }

        #wire-panel { display: flex; justify-content: space-around; margin: 20px 0; background: #000; padding: 15px; border-radius: 5px; }
        .wire { width: 15px; height: 60px; border-radius: 3px; transition: 0.2s; }
        .wire.cut { height: 15px; opacity: 0.2; transform: translateY(20px); }
        #w-Q { background: #ff4444; } #w-W { background: #44ff44; } #w-E { background: #4444ff; }

        /* Pantalla de Perdida */
        #overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 10; flex-direction: column; justify-content: center; align-items: center; border-radius: 7px; padding: 20px; box-sizing: border-box; }
        #overlay h1 { color: var(--danger); margin-bottom: 10px; }
        #scientific-advice { font-size: 0.9rem; color: #ccc; margin-bottom: 20px; font-style: italic; }
        button { background: var(--success); color: white; border: none; padding: 10px 20px; cursor: pointer; font-family: inherit; font-weight: bold; }

        .frozen { background: #00f2ff !important; box-shadow: 0 0 20px #00f2ff !important; }
    </style>
</head>
<body>
<a href="index.html" style="
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 15px;
    background: rgba(0, 255, 65, 0.1);
    border: 1px solid #00ff41;
    color: #00ff41;
    text-decoration: none;
    font-family: 'Courier New', monospace;
    font-size: 0.8rem;
    font-weight: bold;
    border-radius: 4px;
    z-index: 2000;
    transition: all 0.3s;
">
    &lt; VOLVER AL MENU
</a>
<div id="game-container">
    <div id="main-timer">00:30:00</div>
    <div id="status">TEMP: <span id="temp">22</span>°C | ESTADO: <span id="state">LÍQUIDO</span></div>

    <div id="sensor-container">
        <div id="mercury-drop"></div>
        <div class="left contact"></div>
        <div class="right contact"></div>
    </div>

    <div id="wire-panel">
        <div id="w-Q" class="wire"></div>
        <div id="w-W" class="wire"></div>
        <div id="w-E" class="wire"></div>
    </div>

    <p style="font-size: 0.8rem; color: #888;">[Q, W, E] para cortar | [ESPACIO] Nitrógeno | [RATÓN] Equilibrar</p>

    <div id="overlay">
        <h1 id="overlay-title">¡BOOM!</h1>
        <p id="overlay-reason"></p>
        <p id="scientific-advice"></p>
        <button onclick="location.reload()">REINTENTAR NIVEL</button>
    </div>

<script>
    let timeLeft = 30.00;
    let pos = 160, velocity = 0, acceleration = 0, drift = 0;
    let temperature = 22, isFrozen = false, gameActive = true;
    let wiresCut = { Q: false, W: false, E: false };

    const gameInterval = setInterval(() => {
        if (!gameActive) return;

        // 1. Temporizador Principal
        timeLeft -= 0.016;
        document.getElementById('main-timer').textContent = `00:${timeLeft.toFixed(2).replace('.', ':')}`;
        if (timeLeft <= 0) endGame(false, "El tiempo se agotó.", "La gestión del tiempo es vital. Cada segundo cuenta cuando hay una reacción en cadena inminente.");

        // 2. Física del Mercurio
        if (!isFrozen) {
            drift += (Math.random() - 0.5) * 0.02; // Inestabilidad creciente
            velocity += acceleration + drift;
            velocity *= 0.96;
            pos += velocity;
            acceleration = 0; // Reset de fuerza de ratón

            document.getElementById('mercury-drop').style.left = pos + 'px';
            document.getElementById('sensor-container').style.transform = `rotate(${drift * 12}deg)`;

            if (pos <= 15 || pos >= 315) {
                endGame(false, "El mercurio tocó los contactos.", "El mercurio es un metal líquido conductor. Al cerrar el circuito, activaste el detonador. ¡Debiste mantenerlo centrado o congelarlo!");
            }
        } else {
            // Lógica de descongelado
            temperature += 0.4;
            document.getElementById('temp').textContent = Math.floor(temperature);
            if (temperature >= 0) {
                isFrozen = false;
                document.getElementById('state').textContent = "LÍQUIDO";
                document.getElementById('mercury-drop').classList.remove('frozen');
            }
        }
    }, 16);

    document.addEventListener('mousemove', (e) => {
        if (gameActive && !isFrozen) acceleration = (e.movementX || 0) * 0.05;
    });

    document.addEventListener('keydown', (e) => {
        if (!gameActive) return;
        const key = e.key.toUpperCase();
        if (['Q', 'W', 'E'].includes(key) && !wiresCut[key]) {
            wiresCut[key] = true;
            document.getElementById(`w-${key}`).classList.add('cut');
            if (Object.values(wiresCut).every(v => v)) endGame(true, "Bomba Desactivada", "Excelente uso de la criogenia y coordinación motriz.");
        }
        if (e.code === 'Space' && !isFrozen && temperature > 0) {
            isFrozen = true;
            temperature = -196;
            document.getElementById('state').textContent = "CONGELADO";
            document.getElementById('mercury-drop').classList.add('frozen');
        }
    });

    function endGame(win, reason, advice) {
        gameActive = false;
        clearInterval(gameInterval);
        const overlay = document.getElementById('overlay');
        overlay.style.display = 'flex';
        document.getElementById('overlay-title').textContent = win ? "¡LOGRADO!" : "¡EXPLOSIÓN!";
        document.getElementById('overlay-title').style.color = win ? "var(--success)" : "var(--danger)";
        document.getElementById('overlay-reason').textContent = reason;
        document.getElementById('scientific-advice').textContent = advice;
    }
</script>
</body>

</html>
